name: Daily Tech Brief

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tech-brief
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-droid-fallback

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate daily brief
        run: python scripts/run_brief.py --mode daily

      - name: Commit generated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily tech brief"
            git push
          fi
