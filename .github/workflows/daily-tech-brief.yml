name: Daily Tech Brief

on:
  schedule:
    - cron: "7,22,37,52 14,15 * * *"
    - cron: "17 16,18,20,22,0,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-brief-cloud
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.OPENAI_API_KEY || vars.LLM_API_KEY || vars.DEEPSEEK_API_KEY || vars.OPENAI_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Gate scheduled run to 9 AM Chicago
        id: schedule_gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            schedule="${{ github.event.schedule }}"
            local_date="$(TZ=America/Chicago date +%F)"
            local_hour="$(TZ=America/Chicago date +%H)"
            echo "Schedule expression: $schedule"
            echo "America/Chicago local date: $local_date"
            echo "America/Chicago local hour now: $local_hour"

            if [ "$local_hour" -lt 9 ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping before 9 AM Chicago."
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install CJK fonts
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-droid-fallback

      - name: Install Python dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check LLM configuration
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import os
          print("LLM key present:", bool(os.getenv("LLM_API_KEY")))
          print("LLM base:", os.getenv("LLM_BASE_URL") or "https://api.deepseek.com")
          print("LLM model:", os.getenv("LLM_MODEL") or "deepseek-chat")
          PY

      - name: Generate daily brief
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python scripts/run_brief.py --mode daily --send --skip-if-sent

      - name: Commit generated state and output
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data output
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily tech brief"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase --autostash origin main
              sleep 5
            done
            exit 1
          fi

      - name: Upload generated brief artifact
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-brief
          path: |
            output/daily/*.pdf
            output/daily/*.json
          if-no-files-found: error
