name: Major Tech Update Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: major-tech-update-radar
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.OPENAI_API_KEY || vars.LLM_API_KEY || vars.DEEPSEEK_API_KEY || vars.OPENAI_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-droid-fallback

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check LLM configuration
        run: |
          python - <<'PY'
          import os
          print("LLM key present:", bool(os.getenv("LLM_API_KEY")))
          print("LLM base:", os.getenv("LLM_BASE_URL") or "https://api.deepseek.com")
          print("LLM model:", os.getenv("LLM_MODEL") or "deepseek-chat")
          PY

      - name: Scan major update alert
        run: python scripts/run_brief.py --mode alert

      - name: Commit generated state and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update tech alert state"
            git push
          fi

      - name: Upload generated alert artifact
        uses: actions/upload-artifact@v4
        with:
          name: major-ai-update-alert
          path: |
            output/alerts/*.pdf
            output/alerts/*.json
          if-no-files-found: ignore
