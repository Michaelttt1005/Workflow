name: Telegram Diagnostic

on:
  workflow_dispatch:

jobs:
  telegram-diagnostic:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send Telegram diagnostic message
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              raise RuntimeError("TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are required.")

          def post_json(method, data=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              encoded = None if data is None else urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(url, data=encoded)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram {method} failed: {payload}")
              return payload

          bot_payload = post_json("getMe")
          bot = bot_payload.get("result") or {}
          username = bot.get("username") or "unknown"
          bot_id = str(bot.get("id", ""))
          print(f"Telegram bot identity: @{username} first_name={bot.get('first_name') or 'unknown'} bot_id_tail={bot_id[-4:] if bot_id else 'unknown'}")

          now = datetime.now(timezone.utc).isoformat(timespec="seconds")
          chat_tail = str(chat_id)[-4:]
          text = (
              "Codex Telegram diagnostic test\n"
              f"UTC: {now}\n"
              f"Bot: @{username}\n"
              f"Configured chat tail: {chat_tail}\n"
              "If you can read this, the GitHub secret is pointing at this exact bot chat."
          )
          sent = post_json(
              "sendMessage",
              {
                  "chat_id": chat_id,
                  "text": text,
                  "disable_notification": "false",
              },
          )
          result = sent.get("result") or {}
          chat = result.get("chat") or {}
          accepted_id = str(chat.get("id", ""))
          print(
              "Telegram diagnostic accepted: "
              f"chat_type={chat.get('type', 'unknown')} "
              f"chat_id_tail={accepted_id[-4:] if accepted_id else 'unknown'} "
              f"message_id={result.get('message_id', 'unknown')}"
          )
          PY
